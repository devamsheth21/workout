<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORGE">
<title>FORGE · Training</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0c0f;
    --bg2:#101318;
    --panel:#14181e;
    --panel2:#191e26;
    --line:#232a34;
    --line2:#2e3742;
    --ink:#f4f6f9;
    --muted:#8a94a3;
    --faint:#5a6472;
    --ember:#ff5a2c;
    --ember2:#ff8a3d;
    --amber:#ffb347;
    --steel:#4fd0e7;
    --done:#57e39a;
    --shadow:0 18px 40px -18px rgba(0,0,0,.8);
    --disp:'Anton', 'Haettenschweiler', 'Impact', sans-serif;
    --body:'Sora', ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0;
    font-family:var(--body);
    color:var(--ink);
    background:var(--bg);
    padding-bottom:96px;
    line-height:1.5;
    overflow-x:hidden;
  }
  /* atmospheric background: ember glow + steel glow + grid + grain */
  body::before{
    content:""; position:fixed; inset:0; z-index:-2; pointer-events:none;
    background:
      radial-gradient(1100px 520px at 82% -8%, rgba(255,90,44,.20), transparent 60%),
      radial-gradient(900px 500px at -10% 12%, rgba(79,208,231,.10), transparent 55%),
      linear-gradient(180deg, var(--bg2), var(--bg) 60%);
  }
  body::after{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.05;
    background-image:
      linear-gradient(rgba(255,255,255,.6) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.6) 1px, transparent 1px);
    background-size:44px 44px;
    mask-image:linear-gradient(180deg, #000, transparent 70%);
    -webkit-mask-image:linear-gradient(180deg, #000, transparent 70%);
  }

  /* ---------- header ---------- */
  header{
    padding:calc(20px + env(safe-area-inset-top)) 20px 8px;
    position:relative;
  }
  .kicker{
    display:flex; align-items:center; gap:9px;
    font-size:.68rem; letter-spacing:.34em; text-transform:uppercase;
    color:var(--ember2); font-weight:700; margin-bottom:6px;
  }
  .kicker::before{ content:""; width:26px; height:2px; background:var(--ember); display:inline-block; }
  h1.brand{
    font-family:var(--disp); font-weight:400; margin:0;
    font-size:clamp(2.9rem, 15vw, 4.6rem); line-height:.86;
    letter-spacing:.01em; text-transform:uppercase;
    background:linear-gradient(180deg,#fff, #c9cfd8);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 1px 0 rgba(0,0,0,.2);
  }
  h1.brand span{
    display:block; font-size:clamp(1rem,4.6vw,1.35rem); letter-spacing:.12em;
    background:linear-gradient(90deg,var(--ember),var(--amber));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-top:2px;
  }
  .chips{ display:flex; flex-wrap:wrap; gap:7px; margin-top:14px; }
  .chip{
    font-size:.72rem; font-weight:600; color:var(--muted);
    border:1px solid var(--line2); border-radius:999px; padding:5px 11px;
    background:rgba(255,255,255,.02);
  }
  .chip b{ color:var(--ink); }
  .chip.goal{ border-color:rgba(255,90,44,.4); color:var(--ember2); }
  .hint{ margin-top:12px; color:var(--faint); font-size:.76rem; line-height:1.5; }
  .hint b{ color:var(--muted); }

  /* ---------- unit toggle (lb / kg) ---------- */
  .unitbar{ display:flex; align-items:center; gap:10px; margin-top:13px; }
  .unitlabel{ font-size:.68rem; color:var(--faint); text-transform:uppercase; letter-spacing:.14em; font-weight:700; }
  .unittoggle{ display:inline-flex; background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:3px; gap:3px; }
  .unittoggle button{ border:0; background:transparent; color:var(--muted); font-family:var(--body); font-weight:800; font-size:.76rem; padding:6px 18px; border-radius:8px; cursor:pointer; transition:.15s; letter-spacing:.02em; }
  .unittoggle button:active{ transform:scale(.95); }
  .unittoggle button.active{ background:linear-gradient(180deg,var(--ember),#e6461f); color:#fff; box-shadow:0 5px 14px -6px rgba(255,90,44,.8); }

  /* ---------- mode switch (main / alt plans) ---------- */
  .modewrap{ padding:16px 20px 0; }
  .modes{
    display:flex; gap:4px; padding:4px;
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
  }
  .mode{
    flex:1; text-align:center; cursor:pointer; border:0; background:transparent;
    color:var(--muted); font-family:var(--body); font-weight:700; font-size:.78rem;
    padding:10px 6px; border-radius:12px; letter-spacing:.02em; transition:.18s;
    line-height:1.1;
  }
  .mode small{ display:block; font-size:.62rem; font-weight:600; color:var(--faint); letter-spacing:.06em; margin-top:2px; text-transform:uppercase;}
  .mode.active{ background:linear-gradient(180deg,var(--ember),#e6461f); color:#fff; box-shadow:0 6px 16px -6px rgba(255,90,44,.7); }
  .mode.active small{ color:rgba(255,255,255,.85); }

  /* ---------- day tabs ---------- */
  nav{
    display:flex; gap:8px; padding:14px 20px 8px;
    overflow-x:auto; scrollbar-width:none; scroll-snap-type:x proximity;
    position:sticky; top:0; z-index:6;
    background:linear-gradient(180deg, var(--bg) 72%, transparent);
  }
  nav::-webkit-scrollbar{ display:none; }
  .tab{
    scroll-snap-align:start; flex:0 0 auto; cursor:pointer;
    padding:9px 16px; border-radius:12px; white-space:nowrap;
    background:var(--panel); border:1px solid var(--line);
    color:var(--muted); font-weight:700; font-size:.8rem; letter-spacing:.02em;
    display:flex; flex-direction:column; align-items:flex-start; gap:1px; transition:.16s;
  }
  .tab small{ font-size:.6rem; font-weight:600; color:var(--faint); text-transform:uppercase; letter-spacing:.08em; }
  .tab.active{ background:var(--ink); color:#0b0c0f; border-color:var(--ink); }
  .tab.active small{ color:rgba(11,12,15,.6); }

  main{ padding:6px 16px 20px; }
  .day{ display:none; }
  .day.active{ display:block; }
  .day.active .card{ animation:rise .5s cubic-bezier(.2,.7,.2,1) both; }
  .day.active .card:nth-child(1){animation-delay:.02s}
  .day.active .card:nth-child(2){animation-delay:.06s}
  .day.active .card:nth-child(3){animation-delay:.10s}
  .day.active .card:nth-child(4){animation-delay:.14s}
  .day.active .card:nth-child(5){animation-delay:.18s}
  .day.active .card:nth-child(6){animation-delay:.22s}
  .day.active .card:nth-child(7){animation-delay:.26s}
  @keyframes rise{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;} }

  .day-head{ padding:16px 4px 10px; }
  .day-kicker{ font-size:.66rem; letter-spacing:.28em; text-transform:uppercase; color:var(--steel); font-weight:700; }
  .day-title{ font-family:var(--disp); font-weight:400; text-transform:uppercase; font-size:1.9rem; line-height:1; margin:5px 0 8px; letter-spacing:.01em; }
  .day-note{ color:var(--muted); font-size:.82rem; display:flex; gap:8px; align-items:flex-start; }
  .day-note::before{ content:"›"; color:var(--ember); font-weight:800; }
  .track{ margin-top:12px; height:7px; border-radius:999px; background:var(--panel2); overflow:hidden; border:1px solid var(--line); }
  .track > i{ display:block; height:100%; width:0; border-radius:999px; background:linear-gradient(90deg,var(--ember),var(--amber)); transition:width .4s ease; }
  .track-label{ font-size:.72rem; color:var(--faint); margin-top:6px; font-weight:600; }
  .track-label b{ color:var(--done); }

  /* ---------- exercise card ---------- */
  .card{
    position:relative; background:linear-gradient(180deg,var(--panel),#12161c);
    border:1px solid var(--line); border-radius:20px; padding:16px 15px 15px;
    margin-bottom:13px; box-shadow:var(--shadow); overflow:hidden;
  }
  .card::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:linear-gradient(180deg,var(--ember),var(--amber)); opacity:.9; }
  .card.done{ opacity:.62; }
  .card.done::before{ background:var(--done); }
  .card-top{ display:flex; gap:13px; align-items:flex-start; }
  .idx{ font-family:var(--disp); font-size:2rem; line-height:.8; color:var(--line2); flex:0 0 auto; width:34px; }
  .card.done .idx{ color:var(--done); }
  .diagram{
    flex:0 0 58px; width:58px; height:58px; border-radius:14px;
    background:radial-gradient(circle at 40% 30%, #202832, #0e1218);
    border:1px solid var(--line2); display:flex; align-items:center; justify-content:center;
  }
  .diagram svg{ width:44px; height:44px; }
  .info{ flex:1; min-width:0; }
  .ex-name{ font-weight:700; font-size:1.02rem; line-height:1.2; margin:0 0 8px; letter-spacing:-.01em; }
  .metrics{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:8px; }
  .pill{ font-size:.76rem; font-weight:700; padding:5px 10px; border-radius:9px; letter-spacing:.01em; }
  .pill.sr{ background:rgba(255,90,44,.14); color:var(--ember2); border:1px solid rgba(255,90,44,.28); }
  .pill.rest{ background:var(--panel2); color:var(--muted); border:1px solid var(--line2); cursor:pointer; user-select:none; }
  .pill.rest.running{ color:var(--steel); border-color:var(--steel); }
  .pill.rest.ding{ animation:ding .5s ease 3; color:var(--done); border-color:var(--done); }
  @keyframes ding{ 50%{ background:rgba(87,227,154,.2); } }
  .target{ font-size:.68rem; color:var(--faint); text-transform:uppercase; letter-spacing:.12em; font-weight:600; margin-bottom:7px; }
  .cue{ color:var(--muted); font-size:.86rem; line-height:1.45; }
  .beg{ margin-top:8px; font-size:.74rem; line-height:1.4; color:var(--steel); font-weight:600; display:flex; gap:6px; align-items:flex-start; }
  .beg::before{ content:"◂"; color:var(--steel); font-weight:800; opacity:.8; }
  .beg b{ color:var(--ink); font-weight:700; }
  .check{
    flex:0 0 34px; width:34px; height:34px; border-radius:50%; cursor:pointer;
    border:2px solid var(--line2); display:flex; align-items:center; justify-content:center;
    color:transparent; font-size:17px; transition:.15s; margin-top:2px;
  }
  .check:active{ transform:scale(.9); }
  .card.done .check{ background:var(--done); border-color:var(--done); color:#08130c; }

  .actions{ display:flex; align-items:center; gap:8px; margin-top:13px; flex-wrap:wrap; }
  .btn{
    appearance:none; font-family:var(--body); font-weight:700; font-size:.78rem;
    border-radius:11px; padding:9px 13px; cursor:pointer; border:1px solid var(--line2);
    background:var(--panel2); color:var(--ink); display:inline-flex; align-items:center; gap:6px; transition:.15s;
  }
  .btn:active{ transform:scale(.97); }
  .btn.play{ background:linear-gradient(180deg,#2a1a12,#20140d); border-color:#4a2c1a; color:var(--ember2); }
  .btn.play svg{ width:14px; height:14px; }
  .wt{ display:flex; align-items:center; gap:6px; margin-left:auto; }
  .wt label{ font-size:.66rem; color:var(--faint); text-transform:uppercase; letter-spacing:.1em; font-weight:700; }
  .wt input{
    width:76px; background:var(--bg); border:1px solid var(--line2); color:var(--ink);
    border-radius:10px; padding:8px; font-size:.82rem; font-family:var(--body); font-weight:600; text-align:center;
  }
  .wt input:focus{ outline:none; border-color:var(--steel); }

  .drawer{ display:none; margin-top:13px; }
  .drawer.open{ display:block; animation:rise .28s ease both; }

  /* demo: poster thumbnail that swaps to inline player */
  .media{ position:relative; width:100%; aspect-ratio:16/9; border-radius:14px; overflow:hidden; background:#000; border:1px solid var(--line2); }
  .media iframe, .media video, .media img.frame{ position:absolute; inset:0; width:100%; height:100%; border:0; object-fit:contain; }
  .poster{ position:absolute; inset:0; border:0; padding:0; cursor:pointer; background-size:cover; background-position:center; background-color:#0e1218; }
  .poster::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,.15), rgba(0,0,0,.55)); }
  .poster .play-btn{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:62px; height:62px; border-radius:50%; z-index:2;
    background:linear-gradient(180deg,var(--ember),#e6461f); box-shadow:0 10px 26px -8px rgba(255,90,44,.9);
    display:flex; align-items:center; justify-content:center;
  }
  .poster .play-btn svg{ width:24px; height:24px; margin-left:3px; }
  .demo-cap{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
  .demo-cap span{ font-size:.72rem; color:var(--faint); }
  .demo-cap a{ font-size:.72rem; color:var(--steel); text-decoration:none; font-weight:600; }
  .no-demo{ font-size:.8rem; color:var(--muted); padding:12px 14px; background:var(--panel2); border-radius:12px; border:1px solid var(--line2); }

  .steps{ counter-reset:s; list-style:none; margin:0; padding:0; }
  .steps li{ position:relative; padding:8px 0 8px 34px; font-size:.85rem; color:var(--ink); border-bottom:1px solid var(--line); line-height:1.45; }
  .steps li:last-child{ border-bottom:0; }
  .steps li::before{
    counter-increment:s; content:counter(s); position:absolute; left:0; top:7px;
    width:22px; height:22px; border-radius:7px; background:var(--panel2); border:1px solid var(--line2);
    color:var(--ember2); font-size:.72rem; font-weight:800; display:flex; align-items:center; justify-content:center;
  }
  .avoid{ margin-top:11px; font-size:.8rem; color:#ffb3a3; line-height:1.45; background:rgba(255,90,44,.08); border-left:3px solid var(--ember); padding:9px 12px; border-radius:0 10px 10px 0; }
  .avoid b{ color:var(--ember2); text-transform:uppercase; font-size:.72rem; letter-spacing:.08em; }

  .finisher{
    margin-top:6px; padding:14px 16px; border-radius:16px; font-size:.84rem; color:var(--muted);
    background:repeating-linear-gradient(-45deg, rgba(255,90,44,.05), rgba(255,90,44,.05) 10px, transparent 10px, transparent 20px), var(--panel);
    border:1px solid var(--line2);
  }
  .finisher b{ color:var(--amber); font-family:var(--disp); font-weight:400; letter-spacing:.04em; font-size:.95rem; }

  .footer{ margin-top:22px; padding:18px; background:var(--panel); border:1px solid var(--line); border-radius:20px; }
  .footer h3{ margin:0 0 10px; font-family:var(--disp); font-weight:400; text-transform:uppercase; letter-spacing:.04em; font-size:1.2rem; color:var(--ink); }
  .footer ul{ margin:0; padding-left:18px; color:var(--muted); font-size:.82rem; line-height:1.7; }
  .footer ul b{ color:var(--ink); }
  .reset-row{ text-align:center; margin-top:16px; }
  .reset-btn{ background:transparent; border:1px solid var(--line2); color:var(--faint); font-family:var(--body); font-weight:600; font-size:.74rem; padding:9px 18px; border-radius:999px; cursor:pointer; }
  .reset-btn:active{ transform:scale(.97); }

  .diagram svg [stroke="#fb923c"], .diagram svg [fill="#fb923c"]{
    transform-box:fill-box; transform-origin:center; animation:moveY 1.4s ease-in-out infinite;
  }
  @keyframes moveY{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-5px);} }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; } }

  /* ---------- progress / analytics ---------- */
  .fab{
    position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:20;
    width:56px; height:56px; border-radius:50%; border:1px solid var(--line2); cursor:pointer;
    background:linear-gradient(180deg,var(--ember),#e6461f); color:#fff;
    box-shadow:0 12px 28px -8px rgba(255,90,44,.8);
    display:flex; align-items:center; justify-content:center;
  }
  .fab:active{ transform:scale(.94); }
  .fab svg{ width:26px; height:26px; }
  .sheet{ position:fixed; inset:0; z-index:30; background:rgba(6,7,9,.72); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); display:none; }
  .sheet.open{ display:block; }
  .sheet-inner{
    position:absolute; left:0; right:0; bottom:0; max-height:88vh; overflow-y:auto;
    background:var(--bg2); border-top:1px solid var(--line2); border-radius:22px 22px 0 0;
    padding:18px 18px calc(28px + env(safe-area-inset-bottom)); animation:rise .3s ease both;
  }
  .sheet-grip{ width:40px; height:4px; border-radius:999px; background:var(--line2); margin:0 auto 12px; }
  .sheet h2{ font-family:var(--disp); font-weight:400; text-transform:uppercase; font-size:1.7rem; margin:0 0 2px; letter-spacing:.02em; }
  .sheet .sub{ color:var(--faint); font-size:.78rem; margin-bottom:14px; }
  .stat-ex{ padding:12px 0; border-bottom:1px solid var(--line); }
  .stat-ex:last-child{ border-bottom:0; }
  .stat-name{ font-weight:700; font-size:.92rem; margin-bottom:6px; }
  .stat-row{ display:flex; align-items:center; gap:10px; }
  .spark{ flex:1; height:34px; min-width:0; }
  .stat-meta{ font-size:.72rem; color:var(--muted); white-space:nowrap; }
  .stat-meta b{ color:var(--done); }
  .sheet-actions{ display:flex; gap:8px; margin:16px 0 4px; flex-wrap:wrap; }
  .tele-msg{ color:var(--muted); font-size:.86rem; line-height:1.55; background:var(--panel2); border:1px solid var(--line2); padding:14px; border-radius:12px; }
  .tele-msg code{ color:var(--ember2); font-size:.82rem; }
  .tele-msg textarea{ width:100%; margin-top:10px; background:var(--bg); color:var(--ink); border:1px solid var(--line2); border-radius:10px; padding:10px; font-family:var(--body); font-size:.8rem; }
  /* weight-box convention tag */
  .wt label em{ font-style:normal; color:var(--faint); font-weight:800; margin-left:2px; letter-spacing:0; text-transform:none; }
  /* progressive-overload nudge */
  .nudge{ display:none; margin-top:2px; padding:8px 12px; font-size:.76rem; line-height:1.4; color:var(--ember2);
    background:rgba(255,90,44,.08); border:1px solid rgba(255,90,44,.28); border-radius:10px; }
  .nudge.show{ display:block; animation:rise .25s ease both; }
  .nudge b{ color:var(--ink); }
  /* progress panel — summary chips */
  .p-sum{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  .p-stat{ flex:1; min-width:88px; background:var(--panel2); border:1px solid var(--line2); border-radius:12px; padding:11px 12px; }
  .p-stat .n{ font-family:var(--disp); font-size:1.5rem; line-height:1; color:var(--ink); }
  .p-stat .n small{ font-size:.8rem; color:var(--muted); font-family:var(--body); }
  .p-stat .k{ font-size:.66rem; text-transform:uppercase; letter-spacing:.1em; color:var(--faint); font-weight:700; margin-top:5px; }
  .p-stat.hot .n{ color:var(--ember2); }
  .p-src{ font-size:.7rem; color:var(--faint); margin:2px 0 16px; }
  .p-h{ font-size:.7rem; text-transform:uppercase; letter-spacing:.12em; color:var(--faint); font-weight:800; margin:20px 0 10px; }
  /* streak heatmap */
  .heat{ display:grid; grid-template-columns:repeat(var(--cols),1fr); grid-template-rows:repeat(7,1fr); grid-auto-flow:column; gap:3px; }
  .heat-months{ display:grid; grid-template-columns:repeat(var(--cols),1fr); gap:3px; margin-bottom:5px; }
  .heat-months span{ font-size:.6rem; color:var(--faint); font-weight:800; text-transform:uppercase; letter-spacing:.02em; white-space:nowrap; overflow:visible; }
  .heat i{ width:100%; aspect-ratio:1; border-radius:3px; background:var(--panel2); border:1px solid var(--line); }
  .heat i.on{ background:linear-gradient(180deg,var(--done),#2fae72); border-color:transparent; }
  .heat i.act{ background:linear-gradient(180deg,#4d8dff,#2f6ae0); border-color:transparent; }
  .heat i.today{ outline:1.5px solid var(--ember2); outline-offset:1px; }
  .heat-key{ display:flex; align-items:center; flex-wrap:wrap; gap:6px; font-size:.68rem; color:var(--faint); margin-top:8px; line-height:1.5; }
  .heat-key i{ width:11px; height:11px; border-radius:3px; display:inline-block; background:var(--panel2); border:1px solid var(--line); }
  .heat-key i.on{ background:linear-gradient(180deg,var(--done),#2fae72); border-color:transparent; }
  .heat-key i.act{ background:linear-gradient(180deg,#4d8dff,#2f6ae0); border-color:transparent; }
  /* non-gym activity log */
  .act-form{ display:flex; flex-direction:column; gap:10px; }
  .act-form .chip{ background:var(--bg); color:var(--ink); border:1px solid var(--line2); border-radius:999px; padding:8px 14px; font-family:var(--body); font-size:.85rem; cursor:pointer; }
  .act-form .chip:active{ background:linear-gradient(180deg,#4d8dff,#2f6ae0); border-color:transparent; color:#fff; }

/* ---------------- storage ---------------- */
var STORE="neptune_v3_";
function load(k){ try{ return localStorage.getItem(STORE+k); }catch(e){ return null; } }
function save(k,v){ try{ localStorage.setItem(STORE+k,v); }catch(e){} }
function del(k){ try{ localStorage.removeItem(STORE+k); }catch(e){} }

/* ---------------- units (lb ⇄ kg) ----------------
   Weights are ALWAYS stored & logged in kg internally so charts/telemetry stay
   consistent no matter which unit you're viewing. The toggle only changes how
   they're shown and typed. Default is lb (most gyms use pounds). */
var KG_PER_LB = 0.45359237;
function unit(){ return load('unit')==='kg' ? 'kg' : 'lb'; }        // default lb
function kgToDisp(kg){ return unit()==='lb' ? (+kg)/KG_PER_LB : (+kg); }
function dispToKg(v){ return unit()==='lb' ? v*KG_PER_LB : v; }
function fmtInput(kg){                                              // kg store value -> input text in current unit
  if(kg==null || kg==='' || isNaN(+kg)) return '';
  return String(Math.round(kgToDisp(kg)*10)/10).replace(/\.0$/,'');
}
function fmtDisp(kg){ return Math.round(kgToDisp(kg)*10)/10; }      // number, for charts/coach
function niceW(kg){                                                // gym-friendly rounded number in current unit
  var v=kgToDisp(kg);
  return unit()==='lb' ? Math.round(v/5)*5 : Math.round(v/2.5)*2.5;
}

function begText(slug){
  var b=BEGINNER[slug]; if(!b) return '';
  var body = b.bw ? 'bodyweight'
                  : '<b>'+niceW(b.lo)+'–'+niceW(b.hi)+' '+unit()+'</b>'+(b.each?' each hand':'');
  return 'Start light: '+body+(b.note?' · '+b.note:'');
}
/* ---------------- weight-entry convention (what number goes in the box) ----------------
   each  = one dumbbell (per hand)   ·  bar = total bar + all plates
   stack = the number on the machine/cable pin   ·  bw = bodyweight (log added weight only)
   The mode is shown as a tag on each box AND logged with every set so the charts
   and coach export always compare like with like. */
function loadMode(slug){
  var b=BEGINNER[slug];
  if(!b) return '';
  if(b.each) return 'each';
  if(b.bw)   return 'bw';
  if(b.bar)  return 'bar';
  return 'stack';
}
function modeTag(slug){                                             // tiny suffix on the weight label
  var m=loadMode(slug);
  return m==='each' ? '<em>/hand</em>' : m==='bar' ? '<em>total</em>' : m==='stack' ? '<em>stack</em>' : '';
}

function teleOn(){ return !!(TELE.url && /^https?:/i.test(TELE.url)); }
function teleQueue(){ try{ return JSON.parse(load('telequeue')||'[]'); }catch(e){ return []; } }
function teleQueueSet(a){ save('telequeue', JSON.stringify(a.slice(-500))); }
function telePost(row){
  return fetch(TELE.url, {
    method:"POST", keepalive:true,
    headers:{ "Content-Type":"application/json", "X-Token":TELE.secret },
    body: JSON.stringify(row)
  }).then(function(r){ if(!r.ok) throw new Error(r.status); return r; });
}
/* Local, offline-first history — the Progress panel reads this on THIS device
   even with no cloud set up. Cloud (when on) is the cross-device backup. */
function histAll(){ try{ return JSON.parse(load('hist')||'[]'); }catch(e){ return []; } }
function histSave(h){ if(h.length>3000) h=h.slice(-3000); save('hist', JSON.stringify(h)); }
function histPush(row){ var h=histAll(); h.push(row); histSave(h); }
/* Body-weight / waist entries — append (no id). Keeps a caller-set ts (back-dating). */
function logEvent(row){
  row.ts = row.ts || new Date().toISOString();
  histPush(row);
  if(!teleOn()) return;
  telePost(row).catch(function(){ var q=teleQueue(); q.push(row); teleQueueSet(q); });
}
/* Set completion — idempotent by id, so re-tapping the same set never double-logs.
   Keeps a caller-set ts so activities can be logged on a past date. */
function logSet(row){
  row.ts = row.ts || new Date().toISOString();
  var h=histAll(), i=-1;
  if(row.id){ for(var j=0;j<h.length;j++){ if(h[j].id===row.id){ i=j; break; } } }
  if(i>=0) h[i]=row; else h.push(row);           // replace same-id entry, else add
  histSave(h);
  if(!teleOn()) return;
  telePost(row).catch(function(){ var q=teleQueue(); q.push(row); teleQueueSet(q); });
}
/* Undo an accidental tick — removes the local entry, tells the cloud to drop it too. */
function unlogSet(id){
  if(!id) return;
  histSave(histAll().filter(function(r){ return r.id!==id; }));
  if(!teleOn()) return;
  var row={ event:'undo', id:id, ts:new Date().toISOString() };
  telePost(row).catch(function(){ var q=teleQueue(); q.push(row); teleQueueSet(q); });
}
function teleFlush(){
  if(!teleOn()) return;
  var q=teleQueue(); if(!q.length) return;
  var remaining=[]; var chain=Promise.resolve();
  q.forEach(function(row){ chain=chain.then(function(){ return telePost(row); }).catch(function(){ remaining.push(row); }); });
  chain.then(function(){ teleQueueSet(remaining); });
}

/* ---------------- rest timer ---------------- */
function parseRest(s){
  if(!s) return 0;
  var m=s.toLowerCase();
  if(m.indexOf('min')>-1){ var n=parseFloat(m); return Math.round((n||1)*60); }
  var sec=parseInt(m,10); return isNaN(sec)?0:sec;
}
function startRest(el, secs){
  if(el._t){ clearInterval(el._t); el._t=null; el.classList.remove('running'); el.textContent=el._orig; return; }
  if(!secs){ return; }
  el._orig = el._orig || el.textContent;
  el.classList.add('running');
  var left=secs;
  el.textContent="⏱ "+left+"s";
  el._t=setInterval(function(){
    left--;
    if(left<=0){
      clearInterval(el._t); el._t=null;
      el.classList.remove('running'); el.classList.add('ding');
      el.textContent="done!";
      if(navigator.vibrate){ navigator.vibrate([120,60,120]); }
      setTimeout(function(){ el.classList.remove('ding'); el.textContent=el._orig; },1800);
    } else {
      el.textContent="⏱ "+left+"s";
    }
  },1000);
}

function sortByTime(rows){
  return rows.slice().sort(function(a,b){ return (a.ts||a.local_ts||'').localeCompare(b.ts||b.local_ts||''); });
}
function dkey(dt){ return dt.getFullYear()+'-'+('0'+(dt.getMonth()+1)).slice(-2)+'-'+('0'+dt.getDate()).slice(-2); }
/* A <input type="date"> value ("YYYY-MM-DD") → a Date at local noon (avoids timezone day-shift). */
function dateFromInput(v){ if(!v) return new Date(); var p=v.split('-'); return new Date(+p[0], (+p[1])-1, +p[2], 12, 0, 0); }
/* Completed sets, with duplicates collapsed by id and any 'undo' events netted out.
   Local hist is already deduped; this matters for the append-only cloud log. */
function setRows(rows){
  var byId={}, noId=[];
  sortByTime(rows).forEach(function(r){
    if(r.event==='undo' && r.id){ delete byId[r.id]; return; }
    if(!((r.event==='done'||r.event==='set') && r.exercise)) return;
    if(r.id) byId[r.id]=r; else noId.push(r);      // id-less = older entries, keep as-is
  });
  return noId.concat(Object.keys(byId).map(function(k){ return byId[k]; }));
}
function weightsByExercise(rows){
  var by={};
  sortByTime(setRows(rows)).forEach(function(r){
    if(r.weight==null || isNaN(+r.weight)) return;
    (by[r.exercise]=by[r.exercise]||[]).push(+r.weight);
  });
  return by;
}
function bodySeries(rows, kind){
  return sortByTime(rows.filter(function(r){ return r.event===kind && r.weight!=null && !isNaN(+r.weight); }))
    .map(function(r){ return { t:(r.ts||r.local_ts), v:+r.weight }; });
}
function trainedDates(rows){   // gym days (a strength set was logged)
  var s={}; setRows(rows).forEach(function(r){ var t=r.ts||r.local_ts; if(t) s[dkey(new Date(t))]=1; }); return s;
}
function activityDates(rows){   // outside-the-gym days (run, sport, cardio…)
  var s={}; rows.forEach(function(r){ if(r.event==='activity'){ var t=r.ts||r.local_ts; if(t) s[dkey(new Date(t))]=1; } }); return s;
}
function mergeDates(a,b){ var m={}; for(var k in a) m[k]=1; for(var k2 in b) m[k2]=1; return m; }
function currentStreak(dset){
  var d=new Date(); d.setHours(0,0,0,0);
  if(!dset[dkey(d)]) d.setDate(d.getDate()-1);   // today not trained yet? count from yesterday
  var n=0; while(dset[dkey(d)]){ n++; d.setDate(d.getDate()-1); } return n;
}
function sessionsInLastDays(dset, days){
  var d=new Date(); d.setHours(0,0,0,0); var n=0;
  for(var i=0;i<days;i++){ if(dset[dkey(d)]) n++; d.setDate(d.getDate()-1); } return n;
}
function heatHTML(gym, act){
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var today=new Date(); today.setHours(0,0,0,0);
  var start=new Date(today); start.setDate(start.getDate()-83);   // ~12 weeks
  var dow=(start.getDay()+6)%7; start.setDate(start.getDate()-dow); // back up to Monday
  var todayK=dkey(today), cells='', d=new Date(start), n=0;
  while(d<=today){
    var k=dkey(d);
    var cls = gym[k] ? 'on' : (act[k] ? 'act' : '');   // gym wins; else outside activity
    cells+='<i class="'+cls+(k===todayK?' today':'')+'" title="'+k+'"></i>';
    d.setDate(d.getDate()+1); n++;
  }
  var cols=Math.ceil(n/7);
  // one month label per week-column, printed only when the month changes
  var months='', prev=-1, wd=new Date(start);
  for(var c=0;c<cols;c++){ var m=wd.getMonth(); months+='<span>'+(m!==prev?MON[m]:'')+'</span>'; prev=m; wd.setDate(wd.getDate()+7); }
  return '<div class="heatwrap" style="--cols:'+cols+'">'+
      '<div class="heat-months">'+months+'</div>'+
      '<div class="heat">'+cells+'</div>'+
    '</div>'+
    '<div class="heat-key"><i class="on"></i> gym · <i class="act"></i> other activity · '+cols+' weeks (~3 months), newest on the right</div>';
}
function sparkline(vals){
  var w=160,h=34,pad=3;
  var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals), rng=(max-min)||1;
  var pts=vals.map(function(v,i){
    var x=pad+(vals.length===1? (w-2*pad) : (i/(vals.length-1))*(w-2*pad));
    var y=h-pad-((v-min)/rng)*(h-2*pad);
    return x.toFixed(1)+','+y.toFixed(1);
  });
  var last=pts[pts.length-1].split(',');
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">'+
    '<polyline points="'+pts.join(' ')+'" fill="none" stroke="#ff5a2c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="2.8" fill="#ffb347"/></svg>';
}
function liftsHTML(rows){
  var by=weightsByExercise(rows);
  var names=Object.keys(by).sort(function(a,b){ return by[b].length-by[a].length; });
  if(!names.length) return '<div class="tele-msg">No weights logged yet. Tick an exercise off with a number in its <b>weight</b> box and it\'ll chart here.</div>';
  var u=unit(), html='';
  names.forEach(function(n){
    var v=by[n], last=v[v.length-1], best=Math.max.apply(null,v);
    var pr=(v.length>1 && last>=best) ? '<span class="pr-badge">PR</span>' : '';
    html+='<div class="stat-ex"><div class="stat-name">'+n+pr+'</div>'+
      '<div class="stat-row">'+sparkline(v)+
      '<div class="stat-meta">last <b>'+fmtDisp(last)+'</b>'+u+' · best '+fmtDisp(best)+u+' · '+v.length+'×</div></div></div>';
  });
  return html;
}
function bodyTrendHTML(rows, kind, label, unitTxt, conv){
  var s=bodySeries(rows, kind);
  if(!s.length) return '';
  var vals=s.map(function(p){ return conv(p.v); });
  var first=vals[0], last=vals[vals.length-1], d=Math.round((last-first)*10)/10;
  var delta = s.length>1 ? '<span class="delta '+(d<=0?'down':'up')+'">'+(d>0?'+':'')+d+unitTxt+'</span>' : '';
  return '<div class="body-trend">'+sparkline(vals)+
    '<div class="lab">'+label+' <b>'+(Math.round(last*10)/10)+unitTxt+'</b> '+delta+'</div></div>';
}
function coachText(rows){
  var by=weightsByExercise(rows), u=unit();
  var lines=Object.keys(by).map(function(n){ return '- '+n+': '+by[n].map(fmtDisp).join(' → ')+' '+u; });
  var bw=bodySeries(rows,'bw'), wa=bodySeries(rows,'waist');
  var extra='';
  if(bw.length) extra+='\n\nBodyweight ('+u+', oldest → newest): '+bw.map(function(p){ return fmtDisp(p.v); }).join(' → ');
  if(wa.length) extra+='\nWaist (in): '+wa.map(function(p){ return Math.round(p.v*10)/10; }).join(' → ');
  var acts={}; rows.forEach(function(r){ if(r.event==='activity' && r.exercise){ var a=acts[r.exercise]||(acts[r.exercise]={n:0,min:0,mi:0}); a.n++; if(r.mins) a.min+=(+r.mins||0); if(r.dist) a.mi+=(+r.dist||0); } });
  var aks=Object.keys(acts);
  if(aks.length) extra+='\nOther activity: '+aks.map(function(k){ var a=acts[k], s=k+' ×'+a.n; if(a.min) s+=', '+a.min+' min'; if(a.mi) s+=', '+(Math.round(a.mi*10)/10)+' mi'; return s; }).join('; ');
  return "I'm 25M, 83kg, 6ft. Goal: lose belly/love-handle fat while building visible muscle. "+
    "Weight logged per exercise over time ("+u+", oldest → newest). Convention: dumbbells = per-hand weight, "+
    "barbells = total bar+plates, machines = stack value:\n\n"+
    lines.join("\n")+extra+
    "\n\nTell me which lifts are progressing, which are stalled, whether my waist/weight trend fits fat-loss + muscle, "+
    "and exactly what to change next session. Be specific.";
}
function renderProgress(rows){
  var gym=trainedDates(rows), act=activityDates(rows), both=mergeDates(gym,act), sets=setRows(rows).length;
  var streak=currentStreak(both), week=sessionsInLastDays(both,7);
  sheetSub.textContent=sets+' set'+(sets===1?'':'s')+' logged';
  var ACTS=['Run','Hike','Cardio','Sport','Walk','Mobility'];
  var todayK=dkey(new Date());
  var html=''+
    '<div class="p-sum">'+
      '<div class="p-stat'+(streak>0?' hot':'')+'"><div class="n">'+streak+'</div><div class="k">Day streak</div></div>'+
      '<div class="p-stat"><div class="n">'+week+'<small>/7</small></div><div class="k">This week</div></div>'+
      '<div class="p-stat"><div class="n">'+sets+'</div><div class="k">Total sets</div></div>'+
    '</div>'+
    '<div class="p-src">'+(teleOn()?'☁︎ synced across devices':'saved on this device')+'</div>'+
    '<div class="p-h">Consistency</div>'+heatHTML(gym,act)+
    '<div class="p-h">Log a non-gym day</div>'+
    '<div class="act-form">'+
      '<div class="chips">'+ACTS.map(function(a){ return '<button class="chip act-chip" type="button" data-act="'+a+'">'+a+'</button>'; }).join('')+'</div>'+
      '<div class="act-grid">'+
        '<input id="act-in" type="text" placeholder="Activity (e.g. Hike)" maxlength="24"/>'+
        '<input id="act-date" type="date" value="'+todayK+'" max="'+todayK+'"/>'+
        '<input id="act-min" type="text" inputmode="numeric" placeholder="min"/>'+
        '<input id="act-dist" type="text" inputmode="decimal" placeholder="mi (opt)"/>'+
      '</div>'+
      '<button class="btn" type="button" id="act-log">Log activity</button>'+
    '</div>'+
    '<div class="p-h">Body — weight &amp; waist</div>'+
    '<div class="body-form">'+
      '<div class="fld"><label>Weight ('+unit()+')</label><input id="bw-in" type="text" inputmode="decimal" placeholder="—"/></div>'+
      '<div class="fld"><label>Waist (in)</label><input id="wa-in" type="text" inputmode="decimal" placeholder="—"/></div>'+
      '<div class="fld"><label>Date</label><input id="body-date" type="date" value="'+todayK+'" max="'+todayK+'"/></div>'+
      '<button class="btn" type="button" id="body-log">Log</button>'+
    '</div>'+
    bodyTrendHTML(rows,'bw','Weight',unit(),function(kg){ return kgToDisp(kg); })+
    bodyTrendHTML(rows,'waist','Waist','in',function(x){ return x; })+
    '<div class="p-h">Lifts</div>'+liftsHTML(rows)+
    '<div class="sheet-actions"><button class="btn" type="button" id="coach-copy">📋 Copy for coach</button></div>';
  sheetBody.innerHTML=html;

  // Outside-gym activity → colors the chosen day blue. Chips fill the field; Log reads date + metrics.
  var actIn=document.getElementById('act-in');
  Array.prototype.forEach.call(sheetBody.querySelectorAll('.act-chip'), function(b){
    b.onclick=function(){ actIn.value=b.getAttribute('data-act'); actIn.focus(); };
  });
  var actLog=document.getElementById('act-log');
  actLog.onclick=function(){
    var label=(actIn.value||'').trim();
    if(!label){ actLog.textContent='Pick or type an activity'; return; }
    var d=dateFromInput(document.getElementById('act-date').value);
    var mins=parseFloat(document.getElementById('act-min').value);
    var dist=parseFloat(document.getElementById('act-dist').value);
    var row={ event:'activity', id:'act_'+label.toLowerCase().replace(/[^a-z0-9]+/g,'')+'_'+dkey(d),
      exercise:label, ts:d.toISOString() };
    if(!isNaN(mins)) row.mins=mins;
    if(!isNaN(dist)) row.dist=dist;
    logSet(row); actLog.textContent='✓ Logged'; loadRows(renderProgress);
  };

  var logBtn=document.getElementById('body-log');
  logBtn.onclick=function(){
    var bwEl=document.getElementById('bw-in'), waEl=document.getElementById('wa-in');
    var when=dateFromInput(document.getElementById('body-date').value).toISOString();
    var bw=parseFloat(bwEl.value), wa=parseFloat(waEl.value), any=false;
    if(bwEl.value!=='' && !isNaN(bw)){ logEvent({ event:'bw', weight: Math.round(dispToKg(bw)*1000)/1000, ts:when }); any=true; }
    if(waEl.value!=='' && !isNaN(wa)){ logEvent({ event:'waist', weight: Math.round(wa*10)/10, ts:when }); any=true; }
    if(any){ logBtn.textContent='✓ Logged'; loadRows(renderProgress); } else { logBtn.textContent='Enter a number'; }
  };
  var copy=document.getElementById('coach-copy');
  copy.onclick=function(){
    var txt=coachText(rows);
    function fallback(){ sheetBody.insertAdjacentHTML('afterbegin','<div class="tele-msg">Select all &amp; copy, then paste into any AI:<textarea rows="8"></textarea></div>'); sheetBody.querySelector('textarea').value=txt; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ copy.textContent='✓ Copied — paste into an AI'; }, fallback);
    } else { fallback(); }
  };
}
/* Source the rows: cloud (cross-device) when connected, else local device log. */
function loadRows(cb){
  if(!teleOn()){ cb(histAll()); return; }
  sheetSub.textContent='Syncing…';
  fetch(TELE.url, { headers:{ "X-Token":TELE.secret } })
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(rows){ cb(Array.isArray(rows)?rows:[]); })
    .catch(function(){ cb(histAll()); });   // offline / error → fall back to this device
}
fab.onclick=function(){
  sheet.classList.add('open');
  sheetSub.textContent='Loading…';
  sheetBody.innerHTML='<div class="tele-msg">Loading your progress…</div>';
  loadRows(renderProgress);
};

teleFlush(); // resend anything queued while offline

/* ---------------- PWA: install to home screen + offline (hosted version only) ----------------
   Registers a tiny service worker so the page installs and works offline. Fails
   silently when opened as a local file (file://) — the page still works fully. */
if('serviceWorker' in navigator && /^https?:/.test(location.protocol)){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){ /* not hosted / no sw — fine */ });
  });
}
</script>
</body>
